<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Midnight Floor - V2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #overlay { position: absolute; width: 100%; height: 100%; background: black; color: white; 
                   display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #ui { position: absolute; bottom: 20px; right: 20px; color: #0f0; z-index: 50; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 50; }
        #knob { position: absolute; width: 40px; height: 40px; background: white; border-radius: 50%; left: 30px; top: 30px; opacity: 0.5; }
        #static { position: absolute; width: 100%; height: 100%; background: url('https://media.giphy.com/media/oEI9uWUicvSJG/giphy.gif'); opacity: 0; pointer-events: none; mix-blend-mode: screen; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>THE CONCIERGE</h1>
        <p>Find the exit before your light fails.</p>
        <button style="padding: 20px 40px; background: #900; color: white; border: none;" onclick="start()">WAKE UP</button>
    </div>
    
    <div id="ui">POWER: <span id="bat">100</span>%</div>
    <div id="static"></div>
    <div id="joystick"><div id="knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, monster, clock, flashLight;
        let battery = 100;
        let moveX = 0, moveZ = 0;
        let gameActive = false;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.3);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;
            scene.add(camera);

            // Flashlight
            flashLight = new THREE.SpotLight(0xffffff, 5, 20, 0.5, 0.5);
            camera.add(flashLight);
            camera.add(flashLight.target);
            flashLight.target.position.z = -5;

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Build Hotel Hallway
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x222211 });
            const carpetMat = new THREE.MeshStandardMaterial({ color: 0x441111 });

            for(let i=0; i<10; i++) {
                const floor = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 10), carpetMat);
                floor.position.z = -i * 10;
                scene.add(floor);

                const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 10), wallMat);
                wallL.position.set(-2, 2, -i * 10);
                scene.add(wallL);

                const wallR = wallL.clone();
                wallR.position.x = 2;
                scene.add(wallR);
            }

            // Create Shadow Man (The Concierge)
            const bodyGeo = new THREE.BoxGeometry(0.5, 2.5, 0.2);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            monster = new THREE.Mesh(bodyGeo, bodyMat);
            monster.position.set(0, 1.25, -30);
            scene.add(monster);

            clock = new THREE.Clock();
            setupMobileJoystick();
            animate();
        }

        function setupMobileJoystick() {
            const joy = document.getElementById('joystick');
            const knob = document.getElementById('knob');
            
            joy.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                const rect = joy.getBoundingClientRect();
                let x = (t.clientX - rect.left - 50) / 50;
                let y = (t.clientY - rect.top - 50) / 50;
                
                // Clamp
                x = Math.max(-1, Math.min(1, x));
                y = Math.max(-1, Math.min(1, y));
                
                knob.style.transform = `translate(${x*30}px, ${y*30}px)`;
                moveX = x;
                moveZ = y;
            });

            joy.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                moveX = 0; moveZ = 0;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!gameActive) return;

            const delta = clock.getDelta();

            // Movement - using Joystick values
            camera.position.x += moveX * 0.05;
            camera.position.z += moveZ * 0.05;
            camera.rotation.y -= moveX * 0.02;

            // Battery Drain
            battery -= 0.05;
            document.getElementById('bat').innerText = Math.floor(battery);
            if(battery <= 0) flashLight.intensity = 0;

            // Monster Logic
            const dist = camera.position.distanceTo(monster.position);
            
            // Monster creeps only when far or in the dark
            if(dist > 5) monster.position.z += 0.02;
            
            // Visual Static when close
            document.getElementById('static').style.opacity = dist < 5 ? (5 - dist) / 5 : 0;

            if(dist < 1.2) {
                gameActive = false;
                alert("YOU ARE NOW PART OF THE HOTEL.");
                location.reload();
            }

            renderer.render(scene, camera);
        }

        window.start = () => {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            init();
        };
    </script>
</body>
</html>
